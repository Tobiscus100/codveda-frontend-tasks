<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Precision DOM Counter with dynamic steps, floor limits, and state tracking." />
  <title>ApexCount | Precision DOM Counter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="app-container">
    <header class="app-header">
      <div class="logo">
        <span class="logo-accent">Apex</span>Count
      </div>
      <h1 class="app-title">DOM State Counter</h1>
      <p class="app-subtitle">Demonstrating granular DOM manipulation, event lifecycle handling, and floor constraints.</p>
    </header>

    <div class="counter-card">
      <div class="counter-display-wrapper">
        <span class="badge-status" id="boundary-status">Floor Limit Active (&ge; 0)</span>
        <div 
          class="counter-value" 
          id="counter-value" 
          aria-live="polite" 
          aria-atomic="true"
        >0</div>
        <span class="counter-step-label">Current Step: <strong id="step-indicator">&plusmn;1</strong></span>
      </div>

      <div class="step-selector" role="group" aria-label="Step size selector">
        <span class="selector-label">Step:</span>
        <button type="button" class="step-btn active" data-step="1">1</button>
        <button type="button" class="step-btn" data-step="5">5</button>
        <button type="button" class="step-btn" data-step="10">10</button>
      </div>

      <div class="button-group">
        <button 
          type="button" 
          class="btn btn-action btn-decrement" 
          id="decrement-btn" 
          aria-label="Decrease count" 
          disabled
        >
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Decrease</span>
        </button>

        <button 
          type="button" 
          class="btn btn-action btn-reset" 
          id="reset-btn" 
          aria-label="Reset counter to zero"
        >
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
          </svg>
          <span>Reset</span>
        </button>

        <button 
          type="button" 
          class="btn btn-action btn-increment" 
          id="increment-btn" 
          aria-label="Increase count"
        >
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Increase</span>
        </button>
      </div>

      <div class="shortcuts-note">
        <span>Shortcuts: <kbd>+</kbd> Increment &bull; <kbd>-</kbd> Decrement &bull; <kbd>R</kbd> Reset</span>
      </div>
    </div>

    <section class="log-section">
      <div class="log-header">
        <h2 class="log-title">State Mutation Log</h2>
        <button type="button" class="btn-clear-log" id="clear-log-btn">Clear Log</button>
      </div>
      <ul class="log-list" id="log-list" aria-live="polite">
        <li class="log-empty">No mutations recorded yet.</li>
      </ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
